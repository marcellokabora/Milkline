<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<title>Milkline · Herd overview</title>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="theme-color" content="#0b5fa5" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Milkline" />
		<script>
			// Set the theme before first paint so there is no flash between dark barn and bright sun.
			(function () {
				try {
					var pref = localStorage.getItem('milkline:theme');
					var dark = pref ? pref === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
